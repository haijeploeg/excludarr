version: 2
updates:
  - package-ecosystem: pip
    directory: /
    # Only bump a requirement when a new release falls outside its range; raising
    # `>=` floors adds no value for users and would cut a release per bump.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix(docker)
