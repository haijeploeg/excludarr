version: 2

# One weekly PR with every update (pip, GitHub Actions, Docker). Its fix(deps)
# commit cuts a single patch release with all updates at once.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    # Only bump a requirement when a new release falls outside its range; raising
    # `>=` floors adds no value for users.
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: fix(deps)
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    commit-message:
      prefix: fix(deps)
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    commit-message:
      prefix: fix(deps)
