[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excludarr"
version = "2.3.0"
description = "Rule engine for Radarr/Sonarr libraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "croniter>=6.0,<7",
    "filelock>=3.16,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
excludarr = "excludarr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/excludarr"]
# Migration scripts ship inside the package, so they are included automatically.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/excludarr/__init__.py:__version__"]
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
