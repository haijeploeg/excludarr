[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excludarr"
version = "2.0.0"
description = "Rule engine for Radarr/Sonarr libraries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
excludarr = "excludarr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/excludarr"]
# Migration scripts ship inside the package, so they are included automatically.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
