---
services:
  excludarr:
    image: ghcr.io/haijeploeg/excludarr
    container_name: excludarr
    environment:
      - RADARR_API_KEY=secret
      - SONARR_API_KEY=secret
      - TAUTULLI_API_KEY=secret
      - SEERR_API_KEY=secret
      - PLEX_TOKEN=secret
      - CRON_MODE=true
    volumes:
      # excludarr.yml (see excludarr-example.yml), optional crontab, and the SQLite database
      - ./config:/config
    restart: unless-stopped
