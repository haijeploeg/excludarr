# Excludarr v2 example configuration.
# Secrets are written as dollar-brace placeholders and resolved from the environment on load.

# Defaults for every `streaming` condition. List providers with `excludarr providers list`.
profile:
  locale: nl_NL
  providers:
    - Netflix
    - Amazon Prime Video

# Optional: SQLAlchemy URL. Default: excludarr.db next to this file (/config in Docker).
# database: sqlite:////config/excludarr.db

# At least one of radarr/sonarr is required. tautulli, seerr and plex are optional and are
# needed only by the conditions/options that use them.
integrations:
  radarr:
    url: http://radarr:7878
    api_key: ${RADARR_API_KEY}
    # verify_ssl: true
  sonarr:
    url: http://sonarr:8989
    api_key: ${SONARR_API_KEY}
  tautulli:                      # watch data: not_watched_for, watched_within, watched_by, ...
    url: http://tautulli:8181
    api_key: ${TAUTULLI_API_KEY}
  seerr:                         # requests: requested_by, requested_more_than, ...
    url: http://seerr:5055
    api_key: ${SEERR_API_KEY}
  plex:                          # "Leaving Soon" collection + library refresh
    url: http://plex:32400
    token: ${PLEX_TOKEN}
    leaving_soon_collection: Leaving Soon   # collection name

# Rules run in file order. Every rule needs name, target, when and action.
# Defaults: preview: true (report only), grace_period: 0, enabled: true.
rules:
  - name: Streaming movies
    target: radarr
    preview: true                # set to false to let this rule act automatically
    grace_period: 14d            # 0, or <int>(h|d|w); matches wait in the queue first
    leaving_soon_collection: true   # mirror the queue in Plex (requires plex)
    action: delete_files         # deletes files, unmonitors, keeps the Radarr entry so the
                                 # "Monitor again" rule below can bring it back
    when:
      # Optional minimum: replace the shorthand with this mapping:
      # streaming: {providers: [Netflix], monetization: [flatrate], min_quality: hd}
      streaming: my_providers
    unless:                      # any true leaf skips the item
      - tag: keep

  - name: Stale movies
    target: radarr
    preview: true
    grace_period: 14d
    action: delete               # removes the entry, so "Monitor again" never re-adds it
    delete_files: true
    import_exclusion: true       # and keeps lists from adding it back
    when:
      all:                       # any / all / not nest arbitrarily
        - added_more_than: 180d
        - not_watched_for: 30d
    unless:
      - tag: keep

  - name: Unwatched seasons
    target: sonarr
    level: season                # series | season | episode (default: season)
    preview: true
    grace_period: 7d
    action: delete_files
    when:
      all:
        - added_more_than: 90d
        - not_watched_for: 60d

  - name: Trim old seasons
    target: sonarr
    level: season
    action: unmonitor
    when:
      all:
        - keep_latest: { seasons: 2 }   # matches seasons NOT among the latest 2 aired
        - status: ended
    unless:
      - genre: [Anime, Documentary]

  - name: Monitor again when it leaves streaming   # replaces v1 "re-add"
    target: radarr
    action: monitor
    search: true                 # trigger a search after monitoring
    when:
      all:
        - monitored: false
        - not: { streaming: my_providers }

  - name: Tag big unrated movies
    target: radarr
    action: tag
    tag: review
    when:
      all:
        - size_more_than: 20GB
        - has_file: true
        - year: { max: 2010 }
        - not: { rating: { source: imdb, min: 6.0 } }
